<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Agenda Barbearia - Gestão de Horários</title>
</head>
<body>
    <header>
        <h1>Barbearia Nobre</h1>
    </header>
    <main>
        <section>
            <h2>Agendar um horário</h2>
            <form>
                <label for="nome"> Nome:</label>
                <input type="text" id="nome" placeholder="Nome ou Apelidio">
                <button>Confirmar</button>
            </form>



            <h3>Serviços</h3>
            <p>Corte</p>
            <p>Barba</p>
            <p>Combo</p>

            <h4>Horarios Livres</h4>
            <ul>
                <li><time datetime="9:00">9:00</time></li>
                <li><time datetime="10:00">10:00</time></li>
                <li><time datetime="11:00">11:00</time></li>
                <li><time datetime="14:00">14:00</time></li>
                <li><time datetime="15:00">15:00</time></li>
                <li><time datetime="16:00">16:00</time></li>
            </ul>

            <h5>Barbeiros</h5>
                <p>Caio</p>
                <p>Joaquim</p>
                <p>Pedro</p>

            <footer>
                
            </footer>
        </section>
    </main>
</body>
</html>
